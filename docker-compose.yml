services:
  docmind:
    build:
      context: .
      args:
        # 境外服务器访问不了 uv.lock 里的清华源时，取消下一行注释改用官方源
        # UV_INDEX_URL: https://pypi.org/simple
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    image: docmind:latest
    container_name: docmind
    restart: unless-stopped
    ports:
      # 宿主端口可改（HOST_PORT=9001 docker compose up -d），容器内固定 8001
      - "${HOST_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0；下面几项与 Dockerfile 保持一致
      DOCMIND_HOST: 0.0.0.0
      DOCMIND_PORT: 8001
      DOCMIND_DATA_ROOT: /app/data
      DOCMIND_SYSTEM_LOG_FILE: /app/logs/app.log
    volumes:
      - docmind-data:/app/data
      - docmind-logs:/app/logs
    # LibreOffice 与页面光栅化会用到共享内存，默认 64MB 偏小
    shm_size: 512mb

volumes:
  docmind-data:
  docmind-logs:
