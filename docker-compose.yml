services:
  docmind:
    build:
      context: .
      args:
        # 境外服务器访问不了 uv.lock 里的清华源时，改用官方源
        UV_INDEX_URL: ${UV_INDEX_URL:-}
        # Debian 官方源拉取慢时，改成 mirrors.tuna.tsinghua.edu.cn 或 mirrors.aliyun.com
        APT_MIRROR: ${APT_MIRROR:-}
    image: docmind:latest
    container_name: docmind
    restart: unless-stopped
    ports:
      # 只绑回环地址，纯给宿主上调试用（curl /health、SSH 隧道看内置前端）。
      # 线上流量走本项目的 docker 网络直达 gateway，不经过这个端口。
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # 容器内必须监听 0.0.0.0；下面几项与 Dockerfile 保持一致
      DOCMIND_HOST: 0.0.0.0
      DOCMIND_PORT: 8000
      DOCMIND_DATA_ROOT: /app/data
      DOCMIND_SYSTEM_LOG_FILE: /app/logs/app.log
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 直接绑到项目目录：上传原件、任务产物、分析结果、日志在宿主机上都能直接翻看。
      # 容器以 uid/gid 10001 运行，所以这两个目录必须先建好并交给该用户（见 README 部署步骤）：
      #   mkdir -p data logs && chown -R 10001:10001 data logs   # 普通用户前面加 sudo
      # 需要放到独立数据盘时，把左边换成绝对路径即可（如 /data/docmind/data）。
      - ./data:/app/data
      - ./logs:/app/logs
    # LibreOffice 与页面光栅化会用到共享内存，默认 64MB 偏小
    shm_size: 512mb
    # soffice 会派生 soffice.bin：给 PID 1 一个真正的 init 回收子进程，避免僵尸
    init: true
    # SIGTERM 后留出收尾时间；注意在途任务会在下次启动时被标记为中断
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    # 资源上限：宿主 64GB，给容器一个封顶防止异常情形把宿主机吃光。
    # 并发瓶颈在 CPU 核数与上游模型限流，不在内存，所以这里不再压 CPU。
    deploy:
      resources:
        limits:
          memory: 32g
          # 需要给宿主机留出明确余量时再打开，值建议 = CPU 核数
          # cpus: "8.0"
    logging:
      # 容器 stdout 只有 uvicorn 的告警；应用日志写在宿主机 ./logs/app.log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # DocMind 专属入口：与同机其它站点的 nginx 完全无关，也不占用它们的 80/443。
  # 容器内监听 443，宿主端口由 DOCMIND_HTTPS_PORT 决定（默认 8443），
  # 因此对外地址形如 https://docmind.wecanintl.com:8443
  gateway:
    image: nginx:alpine
    container_name: docmind-gateway
    restart: unless-stopped
    ports:
      # 只映射 HTTPS；80 不映射（标准 80 被别处占着，也没有跳转的必要）
      - "${DOCMIND_HTTPS_PORT:-8443}:443"
    volumes:
      # 覆盖镜像自带的 default.conf：我们的文件是完整 server 块，
      # conf.d/*.conf 在 http 级被 include，放这里正好
      - ./deploy/nginx/docmind.conf:/etc/nginx/conf.d/default.conf:ro
      # 复用现成的泛域名证书（*.wecanintl.com 已覆盖本域名），只读挂载，
      # 证书续期后自动生效，不用重新拷贝。
      # 想彻底拷贝一份到自己项目时，换成 ./deploy/nginx/certs 并自行同步，
      # 但要记得：证书续期后必须重新拷贝，否则到期会报证书过期。
      - /data/docker/freight-agent/nginx/certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
