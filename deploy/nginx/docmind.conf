# DocMind 入口配置 —— 由本项目自带的 nginx 容器（compose 服务 gateway）加载
#
# 定位：与同机其它站点的 nginx **完全无关**，不共用也不占用它们的 80/443。
#       容器内监听 443，宿主端口由 compose 的 DOCMIND_HTTPS_PORT 决定（默认 8443）。
#
# 对外地址：https://ai.wecanintl.com:8443/docmind/...
#   - 复用 ai.wecanintl.com 现成的解析（指向本机），因此**不需要新增 DNS 记录**；
#   - 证书是泛域名 *.wecanintl.com，覆盖 ai.wecanintl.com，浏览器无警告；
#   - 若以后补上 docmind.wecanintl.com 的 A 记录，同一份配置也直接可用（见 server_name）。
#
# 生效：
#   docker compose up -d gateway           # 首次
#   docker exec docmind-gateway nginx -t
#   docker exec docmind-gateway nginx -s reload
#
# 前置条件：
#   1) 阿里云安全组：**放行宿主映射端口（默认 8443/TCP）**——与 80/443 方案相比，
#      唯一多出来的一步；
#   2) 证书：只读挂载现成的泛域名证书，续期后自动生效，无需新签。
#
# 因为不用标准端口，这里不做 HTTP→HTTPS 跳转，容器也不监听 80。

server {
    # 容器内固定 443；宿主端口在 compose 里映射（8443:443）
    listen 443 ssl;
    # 只此一个 server 块，它就是 8443 这个端口上的默认 server：
    # 凡是解析到本机、访问 8443 的域名都由它接（包括直接用 IP）。
    # 显式列出两个名字只为可读性；以后加了 docmind 的解析也不用改配置。
    server_name ai.wecanintl.com docmind.wecanintl.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传原件上限：必须 >= 应用侧 DOCMIND_MAX_FILE_SIZE_BYTES（默认 50MB）
    client_max_body_size 50m;

    # ============ 对外唯一开放的入口：业务接口 ============
    # 完整前缀是 /docmind/analysis/**（应用 Settings.api_prefix = /docmind），
    # 所以调用方的接口基址是 https://ai.wecanintl.com:8443/docmind
    location /docmind/ {
        # 同一 compose 项目内的服务，按服务名/容器名互访
        proxy_pass http://docmind:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 keep-alive，否则 SSE 长连接会被上游提前断开
        proxy_set_header Connection "";

        # SSE 进度流：不缓冲。任务时间线依赖它实时下推事件
        proxy_buffering off;
        proxy_cache off;

        # 任务可能长时间停在模型调用甚至被暂停
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 探活：供监控使用。不需要就直接删掉这三行
    location = /health {
        access_log off;
        proxy_pass http://docmind:8000/health;
    }

    # GET /docmind/analysis/files 会列出所有任务的原始文件名，只供本地联调，
    # 线上封死。返回 404 而不是 403：不向外暴露该接口的存在。
    # 精确匹配（location =）优先于上面的 /docmind/ 前缀，路径大小写与查询串都不受影响
    # （nginx 匹配只看 path，且默认会归一化 // 与 /./）。
    #
    # 只挡公网入口：SSH 隧道直达宿主 127.0.0.1:8000 时不经过 nginx，测试照旧可用。
    location = /docmind/analysis/files {
        return 404;
    }

    # ============ 其余一律不对外 ============
    # 覆盖：内置前端 demo（/ 、/static/**）、/docs、/redoc、/openapi.json
    # 测试期要看 demo 不要在这里放开，走 SSH 隧道经宿主回环口访问，生产零暴露：
    #   ssh -L 8000:127.0.0.1:8000 root@<服务器IP>
    #   本机浏览器打开 http://127.0.0.1:8000/
    location / {
        return 404;
    }
}
